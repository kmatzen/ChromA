name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Pinned toolchain.  Both of these were floating refs (devkitarm:latest and
# mgba master, re-pulled every run), which made CI non-reproducible: the
# April 2026 known-green tree fails today with an identical set of visual
# failures, purely from toolchain drift.  devkitarm:latest was retagged
# 2026-06-10; 20260221 is the tag that was 'latest' when these baselines
# were generated.  Bump these deliberately, and regenerate baselines in the
# same change.
env:
  MGBA_PIN: 81fa2e982c107a8d337e46cf858aaf99fe4d2e49  # 2026-04-04

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20260221

    steps:
    - uses: actions/checkout@v4

    - name: Build
      run: make
      env:
        DEVKITARM: /opt/devkitpro/devkitARM

    - name: Upload GBA binary
      uses: actions/upload-artifact@v4
      with:
        name: chroma.gba
        path: chroma.gba

    # test_menu.py reads symbol addresses from this map.  Without it, it
    # silently falls back to hardcoded defaults that go stale the moment the
    # memory layout shifts -- 12 of 13 were wrong, so the menu tests were
    # poking unrelated memory and reporting behavioural failures.
    - name: Upload ELF map
      uses: actions/upload-artifact@v4
      with:
        name: chroma.elf.map
        path: build/chroma.elf.map

  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Run RLE codec unit tests
      run: python3 test_roms/test_rle_unit.py

    # The savestate heap lives in battery-backed cart SRAM whose STATEID magic
    # is shared with other Goomba-family forks, and every chain walker trusted
    # the record sizes in it; the delete menu also asked for "any record" with
    # a -1 that a u16 type field can never match, so it erased nothing (#57).
    # Host-native: no toolchain, no emulator, no ROM.
    - name: Run SRAM record chain unit tests
      run: python3 test_roms/test_sram_chain_unit.py

    # The 256-entry ROM bank table was filled without masking, so every entry
    # past the end of a sub-4MB cart pointed outside it, while cart.s masked
    # bank numbers against the size byte the table ignored (#57).
    - name: Run ROM bank table unit tests
      run: python3 test_roms/test_rom_banks_unit.py

    # src/font.lz77 and src/fontpal.bin are committed binaries with no build
    # step, so nothing stopped them drifting from the C code that indexes them,
    # and the shipped stream carried displacement-1 back-references that
    # LZ77UnCompVram cannot decode on hardware -- invisible under mGBA (#60).
    # Host-side: no toolchain, no emulator, no Pillow.
    - name: Validate font assets
      run: python3 scripts/validate_font.py

    # The browser demo deleted every battery save on each ROM load and wrote
    # the ROM under a timestamped name, so a .sav could never be found again
    # (#62).  The two functions that decide whether a user keeps their save --
    # content-hash ROM identity and ROM validation -- are pure, so they are
    # tested here without a browser or a WASM build.
    - name: Run browser demo ROM utility tests
      run: node test_roms/test_demo_rom_utils.mjs

    # ARCHITECTURE/COMPATIBILITY/README/KNOWN_ISSUES each carried numbers that
    # had been true once: a cycle constant off by 16, a palette threshold
    # retuned from 10 to 4, a mapper list promising a tilt sensor that does not
    # exist, hand-maintained IWRAM figures (#64).  Fixing the prose buys a few
    # months; deriving each figure from the source at CI time is what keeps it
    # fixed.  Host-native: no toolchain, no emulator, no ROM.
    - name: Check documentation against source
      run: python3 scripts/check_docs.py

    - name: Download GBA binary
      uses: actions/download-artifact@v4
      with:
        name: chroma.gba

    - name: Download ELF map
      uses: actions/download-artifact@v4
      with:
        name: chroma.elf.map
        path: build

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake libelf-dev libpng-dev \
          libsqlite3-dev libedit-dev python3-pip
        pip3 install --break-system-packages Pillow

    # goomba_compile.py appended the guest ROM straight after chroma.gba with
    # no alignment step, while src/main.c finds that ROM with a 32-bit load at
    # textstart+0x104.  On ARM7 an unaligned ldr rotates instead of faulting,
    # so a misaligned emulator image boots to "No ROM found!" and says nothing
    # more.  There was also no 32 MB cartridge-window check (#60).
    - name: Run goomba_compile unit tests
      run: python3 test_roms/test_goomba_compile.py

    - name: Build mGBA library
      run: |
        git clone https://github.com/mgba-emu/mgba.git /tmp/mgba-build
        git -C /tmp/mgba-build checkout $MGBA_PIN
        mkdir -p /tmp/mgba-build/build
        cd /tmp/mgba-build/build
        cmake .. -DBUILD_QT=OFF -DBUILD_SDL=OFF \
          -DUSE_EPOXY=OFF -DUSE_FFMPEG=OFF -DUSE_LIBZIP=OFF \
          -DUSE_DISCORD_RPC=OFF -DUSE_LUA=OFF -DUSE_LZMA=OFF \
          -DENABLE_VFS_FD=ON -DENABLE_VFS=ON -DENABLE_DIRECTORIES=ON
        make -j$(nproc)

    - name: Build test runner
      run: |
        cc -O2 \
          -I/tmp/mgba-build/include -I/tmp/mgba-build/build/include -I/tmp/mgba-build/src \
          -include /tmp/mgba-build/build/include/mgba/flags.h \
          -DM_CORE_GB -DM_CORE_GBA -DMGBA_DLL \
          -o test_roms/mgba_runner test_roms/mgba_runner.c \
          -L/tmp/mgba-build/build -lmgba -Wl,-rpath,/tmp/mgba-build/build

    # Guards mgba_runner's own argument validation (issue #58): a runner that
    # ignores malformed screenshot/input specs makes every test below vacuous.
    - name: Validate test runner argument handling
      run: python3 test_roms/test_runner_args.py
      env:
        LD_LIBRARY_PATH: /tmp/mgba-build/build

    # Guards the menu/SRAM harness itself (issue #59). Those suites only run
    # in test-full, where they need the private ROMs -- which is how their
    # assertions were able to decay into always-true shapes unnoticed. These
    # checks are host-native, so they run here on every push and PR.
    - name: Validate menu/SRAM harness assertions
      run: python3 test_roms/test_menu_selfcheck.py

    # Guards the accuracy suite's config and reference screens (issue #65):
    # a missing, mis-sized or orphaned reference would otherwise only show up
    # as a MISSING deep in the log below. Host-native, no ROMs needed.
    - name: Validate accuracy suite config
      run: python3 test_roms/test_accuracy_selfcheck.py

    # Guards --rebaseline's own filtering (issue #99). A blanket rebaseline
    # rewrote expected_fail baselines too, which replaces the record of what
    # the output should look like while a bug is open with the current broken
    # output -- retiring bugs like #36 silently. Host-native, so it runs here
    # on every push rather than only in test-full.
    - name: Validate rebaseline filtering
      run: python3 test_roms/test_rebaseline_selfcheck.py

    - name: Run custom ROM visual tests
      run: |
        python3 test_roms/run_tests.py \
          -t ei_delay_test \
          -t halt_bug_test \
          -t jr_hram_test \
          -t rst_timing_test \
          -t sprite_limit_test \
          -t timer_accuracy_test
      env:
        LD_LIBRARY_PATH: /tmp/mgba-build/build

    # Hardware-accuracy suites (Mooneye + Blargg), issue #65 item 1. These
    # ROMs are freely redistributable, unlike the commercial carts in
    # test-roms-private, so the suite lives in this job and gates every PR
    # rather than only running after merge.
    #
    # 35 of the 49 entries are expected failures today -- they are the open
    # accuracy bugs (#41 HALT, #42/#43 IF/IE, #44 timer, #52 STAT/LY, #53 PPU,
    # #56 OAM DMA). They report XFAIL and do not fail the build; when one
    # starts passing it reports XPASS and does, so a fix has to be recorded
    # rather than silently leaving the coverage disabled.
    - name: Fetch accuracy test ROMs
      run: python3 test_roms/fetch_accuracy_roms.py

    - name: Run hardware-accuracy test ROM suite
      run: python3 test_roms/run_accuracy_tests.py --diff-dir /tmp/accuracy-diffs
      env:
        LD_LIBRARY_PATH: /tmp/mgba-build/build

    - name: Upload accuracy diff images
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: accuracy-diffs
        path: /tmp/accuracy-diffs
        if-no-files-found: ignore

    - name: Run RST timing test
      run: python3 test_roms/test_rst_timing.py
      env:
        LD_LIBRARY_PATH: /tmp/mgba-build/build

    # The visual halt_bug_test entry compares a blank screen and passes
    # regardless of behavior; this checks the ROM's SRAM result protocol.
    - name: Run HALT bug behavioral test
      run: python3 test_roms/test_halt_bug.py
      env:
        LD_LIBRARY_PATH: /tmp/mgba-build/build

    - name: Run nexttimeout_alt nesting test
      run: python3 test_roms/test_nexttimeout_nesting.py
      env:
        LD_LIBRARY_PATH: /tmp/mgba-build/build

    - name: Run MBC2 SRAM write-through test
      run: python3 test_roms/test_mbc2_sram.py
      env:
        LD_LIBRARY_PATH: /tmp/mgba-build/build

    # Boots two different battery carts against one shared .sav.  Before the
    # ownership check was wired up, the second game was handed the first
    # game's save and destroyed it (#48).
    - name: Run cross-game SRAM ownership test
      run: python3 test_roms/test_sram_ownership.py
      env:
        LD_LIBRARY_PATH: /tmp/mgba-build/build

    # #52 item 6 asks for the line-153 LY window to be halved from 8 T-cycles
    # to 4.  Measured against mGBA's own GB core the existing 8 is right (166
    # hits against 165) and the proposed 4 is 24 counts low, so this pins
    # ChromA to the reference rather than to the issue text.
    - name: Run LY=153 window test
      run: python3 test_roms/test_ly153_window.py
      env:
        LD_LIBRARY_PATH: /tmp/mgba-build/build

    # gb_pc is a raw host pointer that nothing re-checks as the CPU advances,
    # so a fetch crossing 0xFDFF -> 0xFE00 walked linearly through XGB_RAM
    # into WRAM instead of reaching OAM -- a hang, not a wrong value (#116).
    - name: Run region boundary fetch test
      run: python3 test_roms/test_region_boundary.py
      env:
        LD_LIBRARY_PATH: /tmp/mgba-build/build

    # PUSH/POP/CALL and instruction fetch in echo RAM went through memmap_tbl,
    # which resolved 0xE000 0x80 bytes too high in WRAM (#46).
    - name: Run echo RAM test
      run: python3 test_roms/test_echo_ram.py
      env:
        LD_LIBRARY_PATH: /tmp/mgba-build/build

    # push16/pop16/popAF resolved the host page once, from the first byte, so a
    # stack straddling a 4K boundary sent its second byte to the page the first
    # one was in -- a different buffer entirely for WRAM/echo, SVBK and
    # VRAM/cart-RAM (#98).
    - name: Run stack page straddle test
      run: python3 test_roms/test_stack_straddle.py
      env:
        LD_LIBRARY_PATH: /tmp/mgba-build/build

    # Nothing ever set IF bit 4, so a game that HALTs with IE=0x10 waiting on
    # input hung, and polled input froze until the game rewrote FF00 (#43).
    - name: Run joypad interrupt test
      run: python3 test_roms/test_joypad_irq.py
      env:
        LD_LIBRARY_PATH: /tmp/mgba-build/build

    # FF0F read back the raw stored byte instead of 0xE0 | IF, and stored all
    # 8 bits.  The phantom upper bits then matched IE, and checkIRQ's unmasked
    # IE & IF fell through the priority chain into the unknown-IRQ tail, which
    # dispatches to vector 0x40 (#42).
    - name: Run IF register test
      run: python3 test_roms/test_if_register.py
      env:
        LD_LIBRARY_PATH: /tmp/mgba-build/build

    # TIMA could read below TMA, and the DIV-write falling-edge path tested
    # dividereg bits that are always zero, so it never fired (#44).
    - name: Run timer overflow test
      run: python3 test_roms/test_timer_overflow.py
      env:
        LD_LIBRARY_PATH: /tmp/mgba-build/build

    # checkTimerIRQ stored a flat TMA<<24 on overflow, so the timer restarted
    # from phase zero at every scanline boundary that contained one and drifted
    # steadily (#44 item 1).  A free-running counter sampled at a fixed
    # interval has to give a periodic sequence; before the fix ChromA's period
    # was 19 against mGBA's 4.
    - name: Run timer phase coherence test
      run: python3 test_roms/test_timer_phase.py
      env:
        LD_LIBRARY_PATH: /tmp/mgba-build/build

    # Opcode 0xED fell into jr_fixup and moved PC; FEA0-FEFF reads ran off
    # the end of the OAM buffer; KEY1's unused bits read 0 (#56).
    - name: Run invalid opcode test
      run: python3 test_roms/test_invalid_opcode.py
      env:
        LD_LIBRARY_PATH: /tmp/mgba-build/build

    # Sound registers returned the GBA PSG value unchanged, so write-only and
    # unused bits read back 0 instead of 1 (#55).
    - name: Run sound register read-back test
      run: python3 test_roms/test_sound_readback.py
      env:
        LD_LIBRARY_PATH: /tmp/mgba-build/build

    # Sound_reset left NR11/NR12 and NR50/NR51 outside their post-boot state,
    # and wave RAM written while channel 3 played went to the idle bank (#55).
    - name: Run sound post-boot state and wave bank test
      run: python3 test_roms/test_sound_state.py
      env:
        LD_LIBRARY_PATH: /tmp/mgba-build/build

    # Powering the APU off did not clear the write-only register shadow, so a
    # savestate taken afterwards restored values the APU no longer held (#55).
    - name: Run APU power-off shadow test
      run: python3 test_roms/test_sound_power.py
      env:
        LD_LIBRARY_PATH: /tmp/mgba-build/build

    # LoadIo replayed FF51-FF54 but not FF55, so a state saved mid-HBlank-DMA
    # resumed with the transfer silently cancelled (#51).
    - name: Run HBlank DMA savestate replay test
      run: python3 test_roms/test_hdma_state.py
      env:
        LD_LIBRARY_PATH: /tmp/mgba-build/build

    # rle_decompress's return value was ignored, so a state that decompressed
    # short was applied chunk-by-chunk until LoadState hit garbage (#51).
    - name: Run truncated savestate test
      run: python3 test_roms/test_savestate_corrupt.py
      env:
        LD_LIBRARY_PATH: /tmp/mgba-build/build

    # AfterLoadState always mapped SRAM, so a state saved with an MBC3 RTC
    # register selected came back reading cart RAM instead (#49).
    - name: Run MBC3 RTC select rehydration test
      run: python3 test_roms/test_mbc3_rtc_state.py
      env:
        LD_LIBRARY_PATH: /tmp/mgba-build/build

    # The software RTC divided the frame count by a flat 60; the GB runs at
    # 4194304/70224 = 59.7275Hz, so the clock lost ~6.5 min/day (#49).
    # Host-side unit test: no toolchain, no emulator, no ROM.
    - name: Run software RTC unit tests
      run: python3 test_roms/test_rtc_unit.py

    # MBC2 selects its registers by address bit 8 alone, and its RAM is 512
    # half-bytes that echo through A000-BFFF (#50).
    - name: Run MBC2 banking test
      run: python3 test_roms/test_mbc2_banking.py
      env:
        LD_LIBRARY_PATH: /tmp/mgba-build/build

    # MBC1 applies BANK2<<5 in both modes, and mode 1 also remaps 0000-3FFF;
    # the high bits were zeroed in mode 1 and the low half never moved (#50).
    - name: Run MBC1 mode-1 banking test
      run: python3 test_roms/test_mbc1_mode1.py
      env:
        LD_LIBRARY_PATH: /tmp/mgba-build/build

    # Selecting an RTC register installed empty_W so writes were dropped; the
    # day counter was BCD-decoded though it is binary; DH read a flat 0 (#49).
    - name: Run MBC3 RTC test
      run: python3 test_roms/test_mbc3_rtc.py
      env:
        LD_LIBRARY_PATH: /tmp/mgba-build/build

    # Making the registers writable was only half of it: the next latch
    # recomputed the clock from the frame counter and threw the write away, so
    # a game's clock-set snapped back.  Also covers the DH halt bit (#49).
    - name: Run MBC3 RTC latch test
      run: python3 test_roms/test_mbc3_rtc_latch.py
      env:
        LD_LIBRARY_PATH: /tmp/mgba-build/build

  test-full:
    needs: build
    runs-on: ubuntu-latest
    # Runs on main pushes AND on same-repo PRs.  Fork PRs are excluded because
    # GitHub withholds secrets from them, so TEST_ROMS_PAT would be empty and
    # the private ROM download would fail for reasons unrelated to the change.
    #
    # This exists because the visual and menu suites only ran after merge,
    # which let a timing regression reach main across three red pushes before
    # anyone could see it (see #29 / #30).
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    environment: test-roms

    steps:
    - uses: actions/checkout@v4

    - name: Download GBA binary
      uses: actions/download-artifact@v4
      with:
        name: chroma.gba

    - name: Download ELF map
      uses: actions/download-artifact@v4
      with:
        name: chroma.elf.map
        path: build

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake libelf-dev libpng-dev \
          libsqlite3-dev libedit-dev python3-pip
        pip3 install --break-system-packages Pillow

    - name: Build mGBA library
      run: |
        git clone https://github.com/mgba-emu/mgba.git /tmp/mgba-build
        git -C /tmp/mgba-build checkout $MGBA_PIN
        mkdir -p /tmp/mgba-build/build
        cd /tmp/mgba-build/build
        cmake .. -DBUILD_QT=OFF -DBUILD_SDL=OFF \
          -DUSE_EPOXY=OFF -DUSE_FFMPEG=OFF -DUSE_LIBZIP=OFF \
          -DUSE_DISCORD_RPC=OFF -DUSE_LUA=OFF -DUSE_LZMA=OFF \
          -DENABLE_VFS_FD=ON -DENABLE_VFS=ON -DENABLE_DIRECTORIES=ON
        make -j$(nproc)

    - name: Build test runner
      run: |
        cc -O2 \
          -I/tmp/mgba-build/include -I/tmp/mgba-build/build/include -I/tmp/mgba-build/src \
          -include /tmp/mgba-build/build/include/mgba/flags.h \
          -DM_CORE_GB -DM_CORE_GBA -DMGBA_DLL \
          -o test_roms/mgba_runner test_roms/mgba_runner.c \
          -L/tmp/mgba-build/build -lmgba -Wl,-rpath,/tmp/mgba-build/build

    - name: Download game ROMs
      run: |
        gh release download latest \
          --repo kmatzen/test-roms-private \
          --pattern 'game-roms.zip' \
          --dir /tmp
        unzip -o /tmp/game-roms.zip -d test_roms/
      env:
        GH_TOKEN: ${{ secrets.TEST_ROMS_PAT }}

    # run_all_tests.py already runs the 26-ROM visual suite. This step used to
    # run run_tests.py first (just to collect diff images) and then hand over
    # to run_all_tests.py, which ran it a second time -- doubling the slowest
    # part of CI and giving every flaky baseline two chances to fail the job.
    # --diff-dir is forwarded through the suite runner instead.
    - name: Run full test suite
      run: python3 test_roms/run_all_tests.py --diff-dir /tmp/test-diffs
      env:
        LD_LIBRARY_PATH: /tmp/mgba-build/build

    - name: Generate diff report
      if: always()
      run: |
        if [ -d /tmp/test-diffs ] && ls /tmp/test-diffs/*_comparison.png 1>/dev/null 2>&1; then
          python3 test_roms/generate_diff_report.py /tmp/test-diffs /tmp/test-diffs/report.html
        else
          echo "<html><body><h1>All tests passed — no visual regressions</h1></body></html>" > /tmp/test-diffs-report.html
          mkdir -p /tmp/test-diffs
          cp /tmp/test-diffs-report.html /tmp/test-diffs/report.html
        fi

    - name: Upload diff report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: visual-diff-report
        path: /tmp/test-diffs/report.html

  release:
    # test-full is the suite that actually runs the real games (visual, menu
    # and SRAM).  It used to be missing here, so a red test-full still
    # published a "latest" release -- exactly the regression class that
    # test-full was added for (#29 / #30).  Both jobs below only ever run on
    # a push to main, where test-full is never skipped, so a plain needs is
    # enough to gate them.
    needs: [test, test-full]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Download GBA binary
      uses: actions/download-artifact@v4
      with:
        name: chroma.gba

    - name: Get short SHA
      id: sha
      run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Create/update latest release
      run: |
        gh release delete latest --yes 2>/dev/null || true
        gh release create latest chroma.gba \
          --title "Latest build (${{ steps.sha.outputs.short }})" \
          --notes "Built from [\`${{ steps.sha.outputs.short }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})" \
          --prerelease
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-demo:
    needs: [test, test-full]
    # always() re-enables the job after its needs resolve, so every gate has
    # to be spelled out here.  test-full's result was not among them, which
    # let a red visual suite deploy to Pages anyway.
    if: always() && needs.test.result == 'success' && needs['test-full'].result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
    - uses: actions/checkout@v4

    - name: Download GBA binary
      uses: actions/download-artifact@v4
      with:
        name: chroma.gba

    - name: Get short SHA
      id: sha
      run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Download diff report
      uses: actions/download-artifact@v4
      with:
        name: visual-diff-report
        path: /tmp/diff-report
      continue-on-error: true

    - name: Build pages output
      run: |
        mkdir -p _site
        cp -r docs/* _site/
        cp chroma.gba _site/chroma.gba
        sed -i "s|Game Boy \&middot; Game Boy Color \&middot; on GBA|Game Boy \&middot; Game Boy Color \&middot; on GBA<br><span style=\"font-size:0.7em;color:#334\">build ${{ steps.sha.outputs.short }}</span>|" _site/index.html
        # Include test report if available
        if [ -f /tmp/diff-report/report.html ]; then
          cp /tmp/diff-report/report.html _site/test-report.html
        fi

    - name: Upload pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: _site

    - name: Deploy to GitHub Pages
      id: deploy
      uses: actions/deploy-pages@v4
